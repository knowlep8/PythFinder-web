name: Deploy planner to Firebase Hosting

# The team's network only allows *.firebaseapp.com, not *.pages.dev -- see
# the "reach the team" row in docs/web-planner.md. This is the deploy the
# kids actually use; deploy-pages.yaml's Cloudflare Pages deploy is kept
# running alongside it as a mentor-only mirror, not removed.
#
# Needs one repository secret: FIREBASE_TOKEN, from `firebase login:ci` run
# locally (interactive; the CLI cannot do this non-interactively). The
# Firebase project (pythfinder-planner), its Hosting site, and its Firestore
# database are all created once, by hand / via the Firebase CLI -- see
# web/README.md.

on:
    push:
        branches:
            - main
        paths:
            - "web/**"
            - "pythfinder/**"
            - "tools/slim_wheel.py"
            - "pyproject.toml"
            - ".github/workflows/deploy-firebase.yaml"
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: PythFinder

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install uv
              run: pip install uv

            # Same three commands as web/README.md's "Working on it" section --
            # the wheel the browser fetches, slimmed from 13.5MB to ~0.11MB by
            # stripping the menu images and docs the planner never opens.
            - name: Build and slim the wheel
              run: |
                  uv build --wheel --out-dir dist
                  python tools/slim_wheel.py dist/pythfinder-*.whl --out-dir web/public
                  mv web/public/pythfinder-*.whl web/public/pythfinder.whl

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            # npm run build's own `prebuild` copies Pyodide out of node_modules
            # and the mat/robot images out of pythfinder/Images -- both read
            # straight from this checkout.
            - name: Build the site
              working-directory: web
              run: |
                  npm ci
                  npm run build

            # firebase.json and .firebaserc live in web/, so hosting's "public"
            # path (dist) and the project id both resolve from there.
            - name: Deploy to Firebase Hosting and Firestore rules
              working-directory: web
              run: npx firebase-tools deploy --only hosting,firestore:rules --token "$FIREBASE_TOKEN"
              env:
                  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
