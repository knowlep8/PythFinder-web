# What the container serves. Caching is the only interesting part.
#
# The Pyodide runtime is ~10MB and identical for the life of a release, so it
# is served immutable: a returning kid pays for it once. The page itself and
# the library wheel are rebuilt on every deploy, so they must be revalidated or
# the team will keep planning runs with last week's code.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # nginx's mime.types has no entry for .mjs, so pyodide.mjs goes out as
    # application/octet-stream and the browser refuses to run it as a module --
    # the page fails while curl still sees a cheerful 200.
    #
    # Only .mjs needs this. Everything else the runtime is made of already has
    # a type: .wasm, .zip, .json and .js were all checked against the running
    # container. default_type applies only where the map is silent, which is
    # why this is safe -- a types block here would discard the whole map.
    location ~ \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the rest of the runtime, copied in from node_modules at build time
    location /pyodide/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vite writes content-hashed names, so these can never go stale
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # rebuilt with the library on every deploy, and its name does not change
    location = /pythfinder.whl {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
