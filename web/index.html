<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PythFinder planner</title>
    <style>
      :root { color-scheme: dark; }

      body {
        font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 0;
        padding: 20px;
        background: #101214;
        color: #e6e6e6;
      }

      h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
      p.sub { margin: 0 0 16px; color: #8a8f98; }

      .wrap { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
      .left { flex: 1 1 620px; min-width: 320px; }
      .right { flex: 1 1 380px; min-width: 320px; }

      #field {
        display: block;
        width: 100%;
        aspect-ratio: 200.5 / 114.3;
        background: #17191c;
        border: 1px solid #2a2e34;
        border-radius: 6px;
        touch-action: none;
        cursor: crosshair;
      }
      #field:focus-visible { outline: 2px solid #00e5ff; }

      .transport {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
      }
      #play { width: 42px; font-size: 15px; }
      #scrub { flex: 1; accent-color: #ff6d00; }
      .clock { color: #b9bec6; white-space: nowrap; }
      .clock b { color: #e6e6e6; font-weight: 600; }

      .readout {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin: 8px 0 0;
        color: #b9bec6;
      }
      .readout b { color: #e6e6e6; font-weight: 600; }

      h2 {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8a8f98;
        margin: 0 0 8px;
      }

      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        margin-bottom: 4px;
        background: #17191c;
        border: 1px solid #2a2e34;
        border-radius: 5px;
        cursor: pointer;
        /* Go to pose carries three numbers, a tick and three buttons: without
           this they run off the edge of the panel and cannot be clicked */
        flex-wrap: wrap;
      }
      .step.selected { border-color: #ff6d00; background: #1d1a17; }
      .step.running { border-color: #00e5ff; }
      .step .number { color: #6b7280; width: 16px; }
      .step .title { min-width: 92px; }
      .step .took { margin-left: auto; color: #8a8f98; font-size: 12px; }

      .step label { display: inline-flex; align-items: center; gap: 3px; color: #8a8f98; }
      .step label.reversed { gap: 5px; }

      input[type="number"] {
        width: 62px;
        padding: 3px 5px;
        font: inherit;
        color: #e6e6e6;
        background: #101214;
        border: 1px solid #333a42;
        border-radius: 4px;
      }
      input[type="number"]:focus { outline: 1px solid #00e5ff; }

      button {
        font: inherit;
        color: #d4d8de;
        background: #202429;
        border: 1px solid #333a42;
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      button:hover { background: #2a2f36; }

      .adders { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
      .empty { color: #8a8f98; }

      pre {
        white-space: pre-wrap;
        line-height: 1.6;
        margin: 14px 0 0;
        color: #b9bec6;
      }
    </style>
  </head>
  <body>
    <h1>PythFinder planner</h1>
    <p class="sub">
      Step 2.5 — press play to watch the run, or drag the slider through it.
      Space plays and pauses.
    </p>

    <div class="wrap">
      <div class="left">
        <canvas id="field"></canvas>

        <div class="transport">
          <button id="play" type="button" title="play the run (space)">▶</button>
          <input id="scrub" type="range" min="0" max="100" step="10" value="0"
                 title="scrub through the run" />
          <span class="clock"><b id="now">0.0s</b> / <b id="total">—</b></span>
        </div>

        <div class="readout">
          <span>start: <b id="pose">—</b></span>
          <span>mouse: <b id="mouse">—</b></span>
          <span>run: <b id="run">—</b></span>
        </div>
        <div class="readout">
          <span>at this moment: <b id="atstep">—</b></span>
          <span><b id="atpose">—</b></span>
        </div>
      </div>

      <div class="right">
        <h2>Steps</h2>
        <div id="steps"></div>
        <pre id="log">starting...</pre>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
