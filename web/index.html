<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PythFinder planner</title>
    <style>
      :root { color-scheme: dark; }

      body {
        font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 0;
        padding: 20px;
        background: #101214;
        color: #e6e6e6;
      }

      h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
      p.sub { margin: 0 0 16px; color: #8a8f98; }

      .wrap { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
      .left { flex: 1 1 620px; min-width: 320px; }
      .right { flex: 1 1 380px; min-width: 320px; }

      #field {
        display: block;
        width: 100%;
        aspect-ratio: 200.5 / 114.3;
        background: #17191c;
        border: 1px solid #2a2e34;
        border-radius: 6px;
        touch-action: none;
        cursor: crosshair;
      }
      #field:focus-visible { outline: 2px solid #00e5ff; }

      .transport {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
      }
      #play { width: 42px; font-size: 15px; }
      #scrub { flex: 1; accent-color: #ff6d00; }
      .clock { color: #b9bec6; white-space: nowrap; }
      .clock b { color: #e6e6e6; font-weight: 600; }

      .readout {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin: 8px 0 0;
        color: #b9bec6;
      }
      .readout b { color: #e6e6e6; font-weight: 600; }

      h2 {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8a8f98;
        margin: 0 0 8px;
      }

      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        margin-bottom: 4px;
        background: #17191c;
        border: 1px solid #2a2e34;
        border-radius: 5px;
        cursor: pointer;
        /* Go to pose carries three numbers, a tick and three buttons: without
           this they run off the edge of the panel and cannot be clicked */
        flex-wrap: wrap;
      }
      .step.selected { border-color: #ff6d00; background: #1d1a17; }
      .step.running { border-color: #00e5ff; }
      .step .number { color: #6b7280; width: 16px; }
      .step .title { min-width: 92px; }
      .step .took { margin-left: auto; color: #8a8f98; font-size: 12px; }

      /* a left accent, so it does not fight the selected and running borders */
      .step.troubled { border-left: 3px solid #ff8a80; }

      .problem {
        flex-basis: 100%;      /* its own line inside the wrapped row */
        margin: 5px 0 1px;
        font-size: 12px;
        line-height: 1.5;
      }
      .problem.warning { color: #ffca7a; }
      .problem.error { color: #ff8a80; }

      /* a sequential arm step: the robot waits for it, so it reads as a step */
      .step.arm { border-left: 3px solid #00e5ff; }

      /* parallel actions hang under the move they ride along with */
      .action {
        flex-basis: 100%;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 5px 0 0 22px;
        padding-left: 10px;
        border-left: 2px solid #2a2e34;
        color: #8a8f98;
      }
      .action select { max-width: 120px; }
      .action input[type="number"] { width: 56px; }

      .addaction {
        flex-basis: 100%;
        margin: 5px 0 0 22px;
        font-size: 12px;
        color: #8a8f98;
      }
      .addaction button { font-size: 12px; padding: 2px 6px; }

      .estimate { color: #6b7280; font-style: italic; }

      .step label { display: inline-flex; align-items: center; gap: 3px; color: #8a8f98; }
      .step label.reversed { gap: 5px; }

      input[type="number"] {
        width: 62px;
        padding: 3px 5px;
        font: inherit;
        color: #e6e6e6;
        background: #101214;
        border: 1px solid #333a42;
        border-radius: 4px;
      }
      input[type="number"]:focus { outline: 1px solid #00e5ff; }

      button {
        font: inherit;
        color: #d4d8de;
        background: #202429;
        border: 1px solid #333a42;
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      button:hover { background: #2a2f36; }

      .adders { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
      .empty { color: #8a8f98; }

      h2.spaced { margin-top: 20px; }
      .save { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .save label { display: inline-flex; align-items: center; gap: 5px; color: #8a8f98; }
      .cost { color: #8a8f98; font-size: 12px; }

      input[type="text"] {
        padding: 3px 6px;
        font: inherit;
        color: #e6e6e6;
        background: #101214;
        border: 1px solid #333a42;
        border-radius: 4px;
      }
      input[type="text"]:focus { outline: 1px solid #00e5ff; }
      input.wrong { border-color: #ff8a80; }

      button:disabled { opacity: 0.45; cursor: not-allowed; }

      .spaced-small { margin-top: 6px; }

      select {
        font: inherit;
        color: #e6e6e6;
        background: #101214;
        border: 1px solid #333a42;
        border-radius: 4px;
        padding: 3px 5px;
        max-width: 190px;
      }
      select:focus { outline: 1px solid #00e5ff; }

      pre {
        white-space: pre-wrap;
        line-height: 1.6;
        margin: 14px 0 0;
        color: #b9bec6;
      }
    </style>
  </head>
  <body>
    <h1>PythFinder planner</h1>
    <p class="sub">
      Step 3.2 — add an arm movement as its own step and the robot waits for
      it; add one to a move and it happens while driving.
    </p>

    <div class="wrap">
      <div class="left">
        <canvas id="field"></canvas>

        <div class="transport">
          <button id="play" type="button" title="play the run (space)">▶</button>
          <input id="scrub" type="range" min="0" max="100" step="10" value="0"
                 title="scrub through the run" />
          <span class="clock"><b id="now">0.0s</b> / <b id="total">—</b></span>
        </div>

        <div class="readout">
          <span>start: <b id="pose">—</b></span>
          <span>mouse: <b id="mouse">—</b></span>
          <span>run: <b id="run">—</b></span>
        </div>
        <div class="readout">
          <span>at this moment: <b id="atstep">—</b></span>
          <span><b id="atpose">—</b></span>
        </div>
      </div>

      <div class="right">
        <h2>Steps</h2>
        <div id="steps"></div>

        <h2 class="spaced">For the hub</h2>
        <div class="save">
          <label>name <input id="name" type="text" value="run_a" size="12" /></label>
          <button id="save" type="button">Download .py</button>
          <span id="cost" class="cost">—</span>
        </div>
        <p id="nameproblem" class="problem error" hidden></p>

        <h2 class="spaced">Saved runs</h2>
        <div class="save">
          <button id="keep" type="button" title="save this run under its name">Save</button>
          <select id="saved" title="open a saved run">
            <option value="">— saved runs —</option>
          </select>
          <button id="forget" type="button" title="delete the selected run">Delete</button>
        </div>
        <div class="save spaced-small">
          <button id="export" type="button" title="save the run as a file">Export .json</button>
          <button id="import" type="button" title="open a run file">Import .json</button>
          <input id="importfile" type="file" accept="application/json,.json" hidden />
        </div>

        <pre id="log">starting...</pre>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
