[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythfinder"
version = "0.0.5.2"
description = "Motion Planning library designed for FLL teams"
readme = "README.md"
# the README documents support from 3.10 up; do not raise this to match the dev
# environment, it is what stops older interpreters installing the package
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Contraș Adrian", email = "omegacoresincai@gmail.com" },
]
keywords = [
    "motion-planning",
    "mobile-robots",
    "robotics",
    "first-lego-league",
    "first-robotics",
    "fll",
]
dependencies = [
    "matplotlib>=3.3.0",
    "pygame>=2.0.0",
    "screeninfo>=0.8.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pythfinder*"]
